[main]
include=~/.config/foot/colors.ini
font=Iosthetic Nerd Font:style=Medium:size=14:hintstyle=slight
font-bold=Iosthetic Nerd Font:style=Bold:size=14:hintstyle=slight
font-italic=Iosthetic Nerd Font:style=Medium Italic:size=14:hintstyle=slight
font-bold-italic=Iosthetic Nerd Font:style=Bold Italic:size=14:hintstyle=slight
pad=24x24

[cursor]
blink=true

[mouse]
hide-when-typing=no

[colors]
alpha=0.95

