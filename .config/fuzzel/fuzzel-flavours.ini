# General Configuration
include=~/.config/fuzzel/colors.ini

[main]
# Position - center layar
anchor=center
x-margin=0
y-margin=0

# Size - kotak kecil di tengah kayak gambar
width=30
lines=8

# Font - minimal agar terlihat compact
font=SF Pro Text:style=Medium:size=7:hintstyle=slight
line-height=18
letter-spacing=0

# Appearance
horizontal-pad=20
vertical-pad=10
inner-pad=8

# Layer
layer=overlay

# Match behavior
show-actions=no
terminal=foot

# Icon (hide kalau ga perlu)
icon-theme=Papirus-Dark
icons-enabled=no
image-size-ratio=0.5
