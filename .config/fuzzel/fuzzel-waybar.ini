# Fuzzel config for Waybar style picker
include=~/.config/fuzzel/colors.ini

[main]
# Position
anchor=center
x-margin=0
y-margin=0

# Size
width=40
lines=8

# Font
font=SF Pro Text:style=Medium:size=7:hintstyle=slight
line-height=18
letter-spacing=0

# Appearance
horizontal-pad=20
vertical-pad=10
inner-pad=8

# Layer
layer=overlay

# Match behavior
show-actions=no
terminal=foot

# Icon
icon-theme=Papirus-Dark
icons-enabled=no
image-size-ratio=0.5
