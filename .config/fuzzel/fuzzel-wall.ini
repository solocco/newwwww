# Fuzzel config for wallpaper selector
include=~/.config/fuzzel/colors.ini

[main]
# Position
anchor=center
x-margin=0
y-margin=0

# Size - lebih tinggi untuk list wallpaper
width=50
lines=10

# Font
font=SFMono Nerd Font:style=Medium:size=11:hintstyle=slight
line-height=20
letter-spacing=0

# Appearance
horizontal-pad=20
vertical-pad=12
inner-pad=8

# Layer
layer=overlay

# Match behavior
show-actions=no
terminal=foot

# Icon
icon-theme=Papirus-Dark
icons-enabled=no
image-size-ratio=0.5
