# General Configuration
output=<undefined>
min-width=150
max-width=400
max-height=300
stacking-order=bottom-up
anchor=bottom-right
edge-margin-vertical=8
edge-margin-horizontal=8
notification-margin=8
max-timeout=10
default-timeout=10
idle-timeout=0

# Appearance Settings
border-radius=8
layer=top
border-size=1
padding-vertical=10
padding-horizontal=10
icon-theme=breeze
max-icon-size=40   
# Font Settings (disesuaikan untuk 1920x1280)
title-font=Iosthetic Nerd Font:size=13:weight=bold
title-format=<u>%a%A</u>
summary-font=Iosthetic Nerd Font:size=12:weight=bold
summary-format=<b>%s</b>\n
body-font=Iosthetic Nerd Font:size=12:weight=bold
body-format=%b

progress-bar-height=16  
# Notification Helpers
selection-helper=fuzzel
# selection-helper-uses-null-separator=no
# play-sound=aplay ${filename}

# Colors settings
# Start flavours (default)

# === injected by flavours (dark, text light) ===
# Pakai foreground terang biar jelas di background gelap

# Default
background=1d2021ff
border-color=a7c080ff
title-color=a7c080ff
progress-bar-color=a7c080ff
summary-color=c5cdd9ff   # terang
body-color=f0f4f8ff      # paling terang (putih / abu muda)

[low]
background=1d2021ff
title-color=7fbbb3ff
summary-color=c5cdd9ff
body-color=f0f4f8ff

[normal]
background=1d2021ff
title-color=a7c080ff
summary-color=c5cdd9ff
body-color=f0f4f8ff

[critical]
background=1d2021ff
title-color=dbbc7fff
summary-color=e67e80ff
body-color=f0f4f8ff
# End flavours

