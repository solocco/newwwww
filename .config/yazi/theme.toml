# Generated by flavours (base16) — jangan edit manual, jalanin `flavours apply <scheme>`

[app]
overall = { bg = "#1f1f28" }

[mgr]
cwd              = { fg = "#7e9cd8" }
find_keyword     = { fg = "#c0a36e", italic = true }
find_position    = { fg = "#957fb8", bg = "#2a2a37", italic = true }
symlink_target   = { fg = "#6a9589" }
marker_copied    = { fg = "#76946a", bg = "#76946a" }
marker_cut       = { fg = "#c34043", bg = "#c34043" }
marker_marked    = { fg = "#7e9cd8", bg = "#7e9cd8" }
marker_selected  = { fg = "#c0a36e", bg = "#c0a36e" }
count_copied     = { fg = "#1f1f28", bg = "#76946a" }
count_cut        = { fg = "#1f1f28", bg = "#c34043" }
count_selected   = { fg = "#1f1f28", bg = "#c0a36e" }
border_symbol    = "│"
border_style     = { fg = "#dcd7ba" }

[indicator]
parent  = { fg = "#7e9cd8" }
current = { fg = "#76946a" }
preview = { fg = "#7e9cd8" }
padding = { open = "▐", close = "▌" }

[tabs]
active    = { fg = "#1f1f28", bg = "#7e9cd8" }
inactive  = { fg = "#dcd7ba", bg = "#2a2a37" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1f1f28", bg = "#7e9cd8", bold = true }
normal_alt  = { fg = "#7e9cd8", bg = "#2a2a37" }
select_main = { fg = "#1f1f28", bg = "#c0a36e", bold = true }
select_alt  = { fg = "#c0a36e", bg = "#2a2a37" }
unset_main  = { fg = "#1f1f28", bg = "#c34043", bold = true }
unset_alt   = { fg = "#c34043", bg = "#2a2a37" }

[status]
overall         = { fg = "#dcd7ba", bg = "#2a2a37" }
sep_left        = { open = "", close = "" }
sep_right       = { open = "", close = "" }
perm_type       = { fg = "#7e9cd8" }
perm_read       = { fg = "#c0a36e" }
perm_write      = { fg = "#c34043" }
perm_exec       = { fg = "#76946a" }
perm_sep        = { fg = "#54546d" }
progress_label  = { fg = "#dcd7ba", bold = true }
progress_normal = { fg = "#7e9cd8", bg = "#2a2a37" }
progress_error  = { fg = "#c34043", bg = "#2a2a37" }

[which]
cols            = 3
mask            = { bg = "#1f1f28" }
cand            = { fg = "#6a9589" }
rest            = { fg = "#54546d" }
desc            = { fg = "#957fb8" }
separator       = " -> "
separator_style = { fg = "#54546d" }

[confirm]
border     = { fg = "#7e9cd8" }
title      = { fg = "#7e9cd8" }
body       = { fg = "#dcd7ba" }
list       = { fg = "#dcd7ba" }
btn_yes    = { fg = "#1f1f28", bg = "#76946a" }
btn_no     = { fg = "#1f1f28", bg = "#c34043" }
btn_labels = ["  Yes ", "  No "]

[spot]
border   = { fg = "#7e9cd8" }
title    = { fg = "#7e9cd8" }
tbl_col  = { fg = "#c0a36e" }
tbl_cell = { fg = "#1f1f28", bg = "#c0a36e" }

[notify]
title_info  = { fg = "#76946a" }
title_warn  = { fg = "#c0a36e" }
title_error = { fg = "#c34043" }

[pick]
border   = { fg = "#7e9cd8" }
active   = { fg = "#c0a36e" }
inactive = { fg = "#dcd7ba" }

[input]
border   = { fg = "#7e9cd8" }
title    = { fg = "#7e9cd8" }
value    = { fg = "#dcd7ba" }
selected = { reversed = true }

[cmp]
border       = { fg = "#54546d" }
active       = { fg = "#1f1f28", bg = "#7e9cd8" }
inactive     = { fg = "#dcd7ba" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#7e9cd8" }
title   = { fg = "#7e9cd8" }
hovered = { underline = true }

[help]
on          = { fg = "#957fb8" }
run         = { fg = "#c0a36e" }
desc        = { fg = "#dcd7ba" }
hovered     = { fg = "#1f1f28", bg = "#7e9cd8", bold = true }
footer      = { fg = "#2a2a37", bg = "#dcd7ba" }
icon_info   = ""
icon_warn   = ""
icon_error  = ""

[filetype]
rules = [
	{ mime = "image/*", fg = "#c0a36e" },
	{ mime = "{audio,video}/*", fg = "#957fb8" },
	{ mime = "inode/empty", fg = "#6a9589" },
	{ url = "*", is = "orphan", fg = "#c34043" },
	{ url = "*/", fg = "#dcd7ba" },
]