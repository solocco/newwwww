# Base16 Kanagawa - alacritty color config
# Yang Mulia

[colors]
draw_bold_text_with_bright_colors = false

# Default colors
[colors.primary]
background = '0x1f1f28'
foreground = '0xdcd7ba'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x1f1f28'
cursor = '0xdcd7ba'

# Normal colors
[colors.normal]
black = '0x1f1f28'
red = '0xc34043'
green = '0x76946a'
