scheme: "Boombox"
author: "phara cox"

# Monotone shades (dark theme)
base00: "151515" # deep background (true dark)
base01: "202020" # slightly lighter bg (panels, statusline)
base02: "2b2b2b" # selection bg
base03: "3a3a3a" # comments / subtle separators
base04: "cecfcd" # secondary foreground
base05: "efdfb3" # main foreground
base06: "e8ece9" # brighter foreground / highlights
base07: "fcfcfc" # near-white, max contrast

# Accent colors (warm Boombox vibe)
base08: "cc6e5b" # red / errors
base09: "e5aa9e" # bright red / numbers
base0A: "dabd6c" # yellow / types
base0B: "b6c2b9" # greenish / strings
base0C: "99dbc5" # cyan / support
base0D: "b5b0b3" # functions (soft desaturated accent)
base0E: "e2dfe1" # keywords / soft highlight
base0F: "d8d8d9" # deprecated / alt accent
