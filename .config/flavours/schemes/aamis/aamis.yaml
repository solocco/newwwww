scheme: "Aamis Dark"
author: "VYRX"

# Monotones — dark → light
base00: "0f0f0f" # background (true black)
base01: "5e5959" # darker UI shade
base02: "706a6a" # selection / subtle highlight
base03: "cea37f" # comments warm-muted
base04: "e6caab" # secondary fg
base05: "ede4c8" # default foreground
base06: "eadccc" # brighter highlight fg
base07: "fcfcfc" # fallback white (added for max legibility)

# Accent colors — warm + soft
base08: "e25d6c" # red / errors
base09: "f4bb54" # amber / numbers
base0A: "e8ab3b" # gold / types
base0B: "e2be8a" # warm yellow / strings
base0C: "99dbc5" # cool relief (ambil warna mint dari tone dekat #cea37f)
base0D: "edb95a" # warm accent / functions
base0E: "e9838f" # pink / keywords
base0F: "ecb95c" # deprecated / alt accent


